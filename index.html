<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#101010" />
    <title>Tinfoil Hat | Protect the Signal</title>
    <meta
      name="description"
      content="Conspiracy-inspired apparel for the beautifully suspicious. Question everything. Especially boring shirts."
    />
    <link rel="icon" href="/assets/brand-mark.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"

  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div id="app"></div>
    <div id="announcer" role="status" aria-live="polite"></div>
    <form
      name="frequency"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input name="form-name" value="frequency" /><input
        name="bot-field"
      /><input type="email" name="email" />
    </form>
    <form
      name="contact"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input name="form-name" value="contact" /><input name="bot-field" />
      <input name="name" /><input name="email" type="email" /><textarea
        name="message"
      ></textarea>
    </form>
    <script type="module" src="/src/main.js"></script>
  </body>
